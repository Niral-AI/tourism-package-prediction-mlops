name: Tourism Project Pipeline
on: [push, workflow_dispatch]
permissions: { contents: write }

jobs:
  # ---------------------------------------------------------
  # Job 1: Data Registration & Quality Gate
  # ---------------------------------------------------------
  data-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Data Validation Dependencies
        run: pip install pandas numpy

      - name: Validate Dataset Schema
        run: python tourism_project/model_building/data_register.py

      - name: Upload Dataset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # ---------------------------------------------------------
  # Job 2: Data Preprocessing & Splitting
  # ---------------------------------------------------------
  data-preparation:
    needs: data-registration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Preprocessing Dependencies
        run: pip install pandas scikit-learn

      - name: Execute Data Cleaning and Splitting
        run: python tourism_project/model_building/prep.py

      - name: Upload Train/Test Split Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: "*.csv"

  # ---------------------------------------------------------
  # Job 3: Model Training, Tuning, MLflow Tracking & Model Deployment
  # ---------------------------------------------------------
  model-training:
    needs: data-preparation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML and Experiment Tracking Libraries
        run: pip install pandas scikit-learn xgboost mlflow joblib cloudpickle

      - name: Download Train/Test Split Artifacts
        uses: actions/download-artifact@v4
        with:
          name: data-splits

      - name: Execute Model Training, Hyperparameter Tuning & MLflow Logging
        run: python tourism_project/model_building/train.py

      - name: Commit and Push Winning Model Artifact to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_model.joblib
          git commit -m "Automated model update [skip ci]" || echo "No changes to commit"
          git push
